server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: tenant-living-ai-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: false

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: ${GEMINI_TEMPERATURE:0.2}

app:
  ai:
    enabled: ${APP_AI_ENABLED:false}
  ai-service:
    base-url: ${APP_AI_SERVICE_URL:http://localhost:8081}
    auth-token: ${APP_AI_SERVICE_AUTH_TOKEN:}
    user-header-name: ${APP_AI_SERVICE_USER_HEADER_NAME:X-User-Id}
  backend:
    client:
      base-url: ${BACKEND_BASE_URL:http://localhost:8080}
      auth-token: ${BACKEND_AUTH_TOKEN:}
      user-header-name: ${BACKEND_USER_HEADER_NAME:X-User-Id}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    root: INFO
    com.tenantliving: DEBUG
