services:
  mysql:
    image: mysql:8.4
    container_name: tenant-living-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tenant_living}
      MYSQL_USER: ${MYSQL_USER:-tenant_living}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tenant_living}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - tenant_living_mysql_data:/var/lib/mysql
    networks:
      - tenant-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tenant-living-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tenant_living}?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${MYSQL_USER:-tenant_living}
      - DB_PASSWORD=${MYSQL_PASSWORD:-tenant_living}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-dev-only-change-this-to-a-long-random-secret-32b-min}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      - APP_AI_ENABLED=${APP_AI_ENABLED:-false}
      - SPRING_AI_MODEL_CHAT=${SPRING_AI_MODEL_CHAT:-none}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.2}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tenant-network

networks:
  tenant-network:
    driver: bridge

volumes:
  tenant_living_mysql_data:
