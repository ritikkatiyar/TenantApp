<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Property - Luminous Frost</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#edf5f7",
                      "on-primary-fixed": "#001f24",
                      "primary-container": "#00e5ff",
                      "surface-tint": "#006875",
                      "primary-fixed": "#9cf0ff",
                      "on-background": "#151d1e",
                      "inverse-on-surface": "#eaf2f4",
                      "outline": "#6b7a7d",
                      "tertiary-container": "#fec931",
                      "on-secondary-fixed-variant": "#2f2ebe",
                      "secondary-container": "#6063ee",
                      "tertiary-fixed-dim": "#f3bf26",
                      "on-tertiary-fixed": "#251a00",
                      "secondary-fixed-dim": "#c0c1ff",
                      "error": "#ba1a1a",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#dce4e5",
                      "inverse-primary": "#00daf3",
                      "tertiary-fixed": "#ffdf96",
                      "on-surface-variant": "#3b494c",
                      "on-secondary-container": "#fffbff",
                      "outline-variant": "#bac9cc",
                      "secondary-fixed": "#e1e0ff",
                      "on-error-container": "#93000a",
                      "surface-dim": "#d4dbdd",
                      "surface-container": "#e8eff1",
                      "on-tertiary-fixed-variant": "#594400",
                      "surface-bright": "#f3fbfc",
                      "on-tertiary-container": "#6f5500",
                      "on-primary": "#ffffff",
                      "on-surface": "#151d1e",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "background": "#f3fbfc",
                      "surface-container-high": "#e2e9eb",
                      "on-primary-fixed-variant": "#004f58",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#00626e",
                      "on-secondary-fixed": "#07006c",
                      "secondary": "#4648d4",
                      "surface-variant": "#dce4e5",
                      "surface": "#f3fbfc",
                      "primary-fixed-dim": "#00daf3",
                      "inverse-surface": "#2a3233",
                      "tertiary": "#765a00",
                      "primary": "#006875",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin": "32px",
                      "lg": "40px",
                      "base": "8px",
                      "md": "24px",
                      "gutter": "24px",
                      "xl": "64px",
                      "sm": "12px",
                      "xs": "4px"
              },
              "fontFamily": {
                      "body-sm": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Manrope"
                      ],
                      "body-base": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Manrope"
                      ],
                      "label-caps": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "body-sm": [
                              "14px",
                              {
                                      "lineHeight": "1.5",
                                      "letterSpacing": "0",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-base": [
                              "16px",
                              {
                                      "lineHeight": "1.6",
                                      "letterSpacing": "0",
                                      "fontWeight": "400"
                              }
                      ],
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "1.1",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "800"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "1",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-surface relative overflow-x-hidden">
<!-- Luminous Frost Background Orbs -->
<div class="fixed top-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary-container opacity-20 blur-[100px] pointer-events-none z-0"></div>
<div class="fixed bottom-[-10%] right-[-5%] w-[50vw] h-[50vw] rounded-full bg-inverse-primary opacity-20 blur-[120px] pointer-events-none z-0"></div>
<!-- TopAppBar from JSON -->
<header class="bg-white/40 backdrop-blur-xl font-manrope tracking-tight fixed top-0 w-full border-b border-white/20 shadow-[0_8px_32px_0_rgba(0,229,255,0.05)] flex justify-between items-center px-8 py-4 z-50">
<div class="flex items-center gap-md">
<button class="text-cyan-400 dark:text-cyan-300 hover:bg-white/20 transition-all active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">grid_view</span>
</button>
<h1 class="text-xl font-bold text-slate-900 dark:text-white">Luminous Frost</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-container-high border border-white/40 flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-outline">person</span>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-[100px] px-margin pb-xl max-w-5xl mx-auto relative z-10 flex flex-col gap-lg">
<!-- Contextual Header & Back Action -->
<div class="flex flex-col gap-sm">
<button class="flex items-center gap-xs text-primary font-label-caps text-label-caps w-fit hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                BACK TO PORTFOLIO
            </button>
<h2 class="font-display-lg text-display-lg text-on-surface">Create Property</h2>
</div>
<!-- Glassmorphism Configuration Card -->
<div class="bg-white/70 backdrop-blur-[40px] border border-white rounded-xl shadow-[0_8px_32px_0_rgba(0,229,255,0.05)] p-lg flex flex-col gap-lg">
<p class="font-body-base text-body-base text-on-surface-variant max-w-2xl">
                Enter the foundational details to begin configuring the spatial grid and floors for this property.
            </p>
<form class="flex flex-col gap-md">
<!-- Input: Property Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="propertyName">Property Name</label>
<input class="bg-white/20 backdrop-blur-sm border border-white rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-outline-variant transition-all" id="propertyName" placeholder="e.g. Apex Tower" type="text"/>
</div>
<!-- Input: Address -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="address">Address</label>
<input class="bg-white/20 backdrop-blur-sm border border-white rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-outline-variant transition-all" id="address" placeholder="e.g. 100 Horizon Boulevard" type="text"/>
</div>
<!-- Input: Total Floors -->
<div class="flex flex-col gap-xs w-full md:w-1/3">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="totalFloors">Total Floors</label>
<div class="relative">
<input class="w-full bg-white/20 backdrop-blur-sm border border-white rounded-lg pl-md pr-xl py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-outline-variant transition-all" id="totalFloors" min="1" placeholder="0" type="number"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">layers</span>
</div>
</div>
<!-- Action Area -->
<div class="pt-md mt-md border-t border-white/20 flex justify-end">
<button class="bg-primary-container text-on-primary-container font-label-caps text-label-caps px-lg py-sm rounded-full shadow-[0_4px_12px_rgba(0,229,255,0.2)] hover:bg-primary hover:text-white transition-all active:scale-95 duration-200" type="button">
                        SAVE &amp; CONFIGURE FLOORS
                    </button>
</div>
</form>
</div>
</main>
</body></html>
