<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Manrope:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #f4faff;
            color: #141d21;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: #ffffff;
            border: 1px solid #bac9cd;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(0, 224, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(236, 245, 251, 1) 0%, transparent 50%);
        }
        .btn-cyan {
            background: #00ccff;
            box-shadow: 0 4px 14px 0 rgba(0, 204, 255, 0.39);
        }
        .btn-cyan:hover {
            background: #00b8e6;
            box-shadow: 0 6px 20px rgba(0, 204, 255, 0.45);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006877",
                        "on-primary-fixed": "#001f25",
                        "error-container": "#ffdad6",
                        "secondary": "#0059bb",
                        "surface-container": "#e6eff5",
                        "on-tertiary-fixed-variant": "#2e4b53",
                        "outline": "#6b7a7d",
                        "on-primary-fixed-variant": "#004e5a",
                        "surface-container-low": "#ecf5fb",
                        "tertiary-fixed": "#c9e8f2",
                        "secondary-fixed": "#d8e2ff",
                        "secondary-container": "#0070ea",
                        "tertiary-container": "#b3d1db",
                        "on-background": "#141d21",
                        "primary-fixed-dim": "#00daf8",
                        "on-tertiary-container": "#3e5a63",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d2dbe1",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#fefcff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#e9f2f8",
                        "surface-tint": "#006877",
                        "primary-fixed": "#a5eeff",
                        "on-surface-variant": "#3b494c",
                        "surface": "#f4faff",
                        "on-tertiary-fixed": "#001f27",
                        "primary-container": "#00e0ff",
                        "outline-variant": "#bac9cd",
                        "on-secondary-fixed-variant": "#004493",
                        "on-primary-container": "#005f6d",
                        "on-primary": "#ffffff",
                        "background": "#f4faff",
                        "inverse-surface": "#293236",
                        "secondary-fixed-dim": "#adc7ff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#001a41",
                        "tertiary-fixed-dim": "#adcbd6",
                        "surface-container-high": "#e0e9ef",
                        "inverse-primary": "#00daf8",
                        "tertiary": "#46636c",
                        "surface-container-highest": "#dbe4ea",
                        "surface-bright": "#f4faff",
                        "surface-variant": "#dbe4ea",
                        "on-surface": "#141d21"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "display-lg-mobile": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "body-md": ["Inter"],
                        "label-sm": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-margin-mobile relative overflow-hidden bg-background">
<!-- Atmospheric Background Elements -->
<div class="mesh-gradient"></div>
<!-- Login Container -->
<main class="w-full max-w-md z-10">
<!-- Logo/Shield Area -->
<div class="flex flex-col items-center mb-10 animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="w-20 h-20 bg-white rounded-xl flex items-center justify-center mb-6 border border-outline-variant shadow-xl">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                shield_person
            </span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface text-center mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center opacity-70">TenantApp Security Protocol</p>
</div>
<!-- Login Card -->
<section class="glass-panel p-8 rounded-2xl animate-in fade-in zoom-in duration-1000">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2 group">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-14 bg-surface-container-low border border-outline-variant rounded-lg pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary-container/40 focus:border-primary transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2 group">
<div class="flex justify-between items-center ml-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-14 bg-surface-container-low border border-outline-variant rounded-lg pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary-container/40 focus:border-primary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-3 py-1">
<div class="relative flex items-center h-5">
<input class="w-5 h-5 bg-white border border-outline-variant rounded focus:ring-primary text-primary transition-all cursor-pointer" id="remember" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Sign In Button -->
<button class="w-full h-14 btn-cyan rounded-lg font-headline-md text-headline-md text-white tracking-wide active:scale-[0.98] transition-all flex items-center justify-center group" type="submit">
                SIGN IN
                <span class="material-symbols-outlined ml-2 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Bottom Actions -->
<div class="mt-8 pt-8 border-t border-outline-variant/30 flex flex-col items-center space-y-4">
<p class="font-body-md text-body-md text-on-surface-variant opacity-60">Don't have an account?</p>
<button class="font-label-sm text-label-sm text-primary border border-primary/30 px-8 py-3 rounded-full hover:bg-primary-container/10 transition-all font-semibold uppercase tracking-wider">
                REQUEST ACCESS
            </button>
</div>
</section>
<!-- Footer Info -->
<footer class="mt-12 text-center opacity-60">
<p class="font-label-sm text-label-sm uppercase tracking-tighter text-on-surface-variant">
            © 2024 COMMAND CENTER • SECURE INFRASTRUCTURE
        </p>
</footer>
</main>
<script>
    // Simple button press effect
    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => {
        btn.addEventListener('touchstart', () => {
            btn.style.transform = 'scale(0.97)';
        });
        btn.addEventListener('touchend', () => {
            btn.style.transform = 'scale(1)';
        });
    });

    // Form focus visual feedback
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            if (input.type !== 'checkbox') {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.classList.add('transition-transform');
            }
        });
        input.addEventListener('blur', () => {
            if (input.type !== 'checkbox') {
                input.parentElement.classList.remove('scale-[1.01]');
            }
        });
    });
</script>
</body></html>
