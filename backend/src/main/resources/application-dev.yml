spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/livic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:livic}
    password: ${DB_PASSWORD:livic}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:mysql://localhost:3307/livic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    user: ${DB_USERNAME:livic}
    password: ${DB_PASSWORD:livic}
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
logging:
  level:
    com.livic: DEBUG
    org.springframework.security: INFO
    org.flyway: DEBUG
