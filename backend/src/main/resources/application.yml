spring:
  application:
    name: tenant-living-backend

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

app:
  jwt:
    # HS256 requires a secret with enough entropy; use at least 32 bytes in production (APP_JWT_SECRET).
    secret: ${APP_JWT_SECRET:dev-only-change-this-to-a-long-random-secret-32b-min}
    access-expiration-ms: ${APP_JWT_ACCESS_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_MS:604800000}
  auth:
    max-failed-login-attempts: ${APP_AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration-ms: ${APP_AUTH_LOCKOUT_DURATION_MS:900000}
  logging:
    correlation-header-name: ${APP_CORRELATION_HEADER_NAME:X-Correlation-Id}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
